services:
  web:
    build: .
    container_name: codenova-web-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codenova-redis-db
    ports:
      - "6379:6379"
    restart: unless-stopped